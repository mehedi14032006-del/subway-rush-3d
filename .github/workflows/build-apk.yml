name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Download & bundle 3D GLB + WAV assets offline
        run: |
          npm run fetch-assets
          ls -lh public/assets/models | head -n 15

      - name: Build production web bundle
        run: npm run build

      - name: Add Capacitor Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Lock portrait orientation
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if grep -q 'android:name=".MainActivity"' "$MANIFEST" && ! grep -q 'screenOrientation' "$MANIFEST"; then
            sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="portrait"/' "$MANIFEST"
          fi

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: subway-rush-3d-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
